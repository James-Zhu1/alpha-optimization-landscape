[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-optimization-landscape"
version = "0.1.0"
description = "Portfolio case study mapping quantitative alpha-search trajectories under honest holdout validation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6",
  "yfinance>=0.2.40",
  "scikit-learn>=1.4",
  "umap-learn>=0.5.6",
  "optuna>=3.6",
  "matplotlib>=3.8",
  "plotly>=6",
  "streamlit>=1.40",
]

[project.optional-dependencies]
test = [
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8",
  "ruff>=0.5",
  "types-PyYAML>=6",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
